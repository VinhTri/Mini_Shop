    spring.application.name=api-app-customer
spring.config.import=optional:file:.env.properties,optional:file:../.env.properties,optional:file:backend/.env.properties

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minishop?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JSON
spring.jackson.serialization.write-dates-as-timestamps=false

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=604800000

# Optional demo accounts (disabled by default)
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@shop.com}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.user-email=${SEED_USER_EMAIL:user@shop.com}
app.seed.user-password=${SEED_USER_PASSWORD:}

# Server Port - Customer API
server.port=9190
