spring.application.name=api-web-admin
spring.config.import=optional:file:.env.properties,optional:file:../.env.properties,optional:file:backend/.env.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minishop?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.write-dates-as-timestamps=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=604800000

app.seed.enabled=false

server.port=9191
